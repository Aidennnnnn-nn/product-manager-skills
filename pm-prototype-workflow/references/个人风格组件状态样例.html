<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>个人风格组件状态样例</title>
  <style>
    :root{--bg:#202125;--surface:#2B2D31;--surface-raised:#34363A;--surface-sunken:#25262A;--border:#41444A;--ink:#F3F4F6;--muted:#B2B6BF;--subtle:#969CA7;--brand:#B7F35A;--brand-hover:#C7FF72;--on-brand:#17200F;--danger:#FF9D9D;--control:40px;--radius-control:10px;--radius-panel:16px;--font:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}main{width:1180px;margin:32px auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel)}h1{margin:0 0 24px;font-size:24px}.group{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}.sample{padding:18px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-panel)}h2{margin:0 0 14px;font-size:16px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.button{height:36px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-control);background:var(--surface-sunken);color:var(--ink);font:inherit}.button.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.button.danger{border-color:var(--danger);color:var(--danger)}.button[disabled]{opacity:.5;cursor:not-allowed}.button.loading{cursor:wait}.control{width:220px;height:var(--control);padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface-sunken);color:var(--ink)}.control.error{border-color:var(--danger)}.switch{width:42px;height:24px;padding:3px;border:0;border-radius:99px;background:var(--brand)}.switch span{display:block;width:18px;height:18px;border-radius:50%;background:var(--on-brand);margin-left:16px}.switch.off{background:var(--border-strong)}.switch.off span{margin-left:0;background:var(--ink)}.notice{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--brand);border-radius:var(--radius-control);color:var(--brand)}.notice.failure{border-color:var(--danger);color:var(--danger)}.confirmation{padding:18px;border:1px solid var(--border-strong);border-radius:var(--radius-panel);background:var(--surface);max-width:440px}.confirmation header,.confirmation footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.confirmation h3{margin:0;font-size:16px}.confirmation footer{justify-content:flex-end;margin-top:18px}.sample-note{color:var(--subtle);font-size:12px;margin-top:12px}
  </style>
</head>
<body>
<main>
  <h1>个人风格组件状态样例</h1>
  <section class="group">
    <article class="sample"><h2>按钮</h2><span class="label">只允许使用已登记变体</span><div class="row"><button class="button primary" data-component="button" data-variant="primary">主操作</button><button class="button" data-component="button" data-variant="default">次操作</button><button class="button danger" data-component="button" data-variant="danger">危险操作</button><button class="button" data-component="button" data-variant="disabled" disabled>不可操作</button><button class="button loading" data-component="button" data-variant="loading" disabled>处理中</button></div></article>
    <article class="sample"><h2>输入与错误</h2><span class="label">默认 / 错误 / 只读</span><div class="row"><input class="control" data-component="control" data-variant="input" placeholder="请输入" readonly><input class="control error" data-component="control" data-variant="error" value="示例内容" readonly><input class="control" data-component="control" data-variant="readonly" value="只读内容" readonly></div></article>
  </section>
  <section class="group">
    <article class="sample"><h2>开关与选择</h2><div class="row"><button class="switch" data-component="switch" data-variant="on" role="switch" aria-checked="true"><span></span></button><button class="switch off" data-component="switch" data-variant="off" role="switch" aria-checked="false"><span></span></button><label><input type="checkbox" data-component="choice" data-variant="checkbox" checked> 已选择</label><label><input type="radio" data-component="choice" data-variant="radio" checked> 当前项</label></div></article>
    <article class="sample"><h2>反馈</h2><div class="row"><div class="notice" data-component="notice" data-variant="success">✓ 操作成功</div><div class="notice failure" data-component="notice" data-variant="failure">× 操作失败</div></div></article>
  </section>
  <section class="sample"><h2>确认弹窗本体</h2><section class="confirmation" data-component="confirmation" data-variant="default"><header><h3>删除条目</h3><button class="button" data-component="button" data-variant="icon" aria-label="关闭">关闭</button></header><p>确认删除该条目？删除后无法恢复。</p><footer><button class="button" data-component="button" data-variant="default">取消</button><button class="button danger" data-component="button" data-variant="danger">删除</button></footer></section><p class="sample-note">状态样例只用于视觉核对，不代表具体业务能力。</p></section>
</main>
</body>
</html>
